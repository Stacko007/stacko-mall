openapi: 3.0.3
info:
  title: Stacko Mall API (MVP)
  version: 0.1.0
servers:
  - url: http://localhost:8080
tags:
  - name: auth
    description: Authentication
  - name: mall-c
    description: C端接口
  - name: mall-admin
    description: 管理端接口
paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: 登录并返回 token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAuthToken"
  /api/admin/products:
    get:
      tags: [mall-admin]
      summary: 管理端商品列表
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProductList"
    post:
      tags: [mall-admin]
      summary: 创建商品
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProduct"
  /api/admin/products/{id}:
    get:
      tags: [mall-admin]
      summary: 管理端商品详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProduct"
    put:
      tags: [mall-admin]
      summary: 更新商品
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProduct"
  /api/c/products:
    get:
      tags: [mall-c]
      summary: C端商品列表
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProductList"
  /api/c/products/{id}:
    get:
      tags: [mall-c]
      summary: C端商品详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseProduct"
  /api/admin/stocks:
    get:
      tags: [mall-admin]
      summary: 管理端库存列表
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseStockList"
  /api/admin/stocks/{productId}:
    get:
      tags: [mall-admin]
      summary: 管理端库存详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseStock"
    put:
      tags: [mall-admin]
      summary: 设置库存
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockSetRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseStock"
  /api/admin/stocks/{productId}/adjust:
    post:
      tags: [mall-admin]
      summary: 调整库存
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseStock"
  /api/c/stocks/{productId}:
    get:
      tags: [mall-c]
      summary: C端库存查询
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseStock"
  /api/c/orders:
    post:
      tags: [mall-c]
      summary: C端创建订单
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrder"
    get:
      tags: [mall-c]
      summary: C端订单列表
      security:
        - bearerAuth: []
      parameters:
        - name: buyerId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrderList"
  /api/c/orders/{id}:
    get:
      tags: [mall-c]
      summary: C端订单详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrder"
  /api/c/orders/{id}/pay:
    post:
      tags: [mall-c]
      summary: C端订单支付
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrder"
  /api/c/orders/{id}/cancel:
    post:
      tags: [mall-c]
      summary: C端订单取消
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrder"
  /api/c/payments/callback:
    post:
      tags: [mall-c]
      summary: 支付回调（mock）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCallbackRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseString"
  /api/c/after-sales:
    post:
      tags: [mall-c]
      summary: C端申请售后
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AfterSalesApplyRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAfterSales"
  /api/c/after-sales/{id}:
    get:
      tags: [mall-c]
      summary: C端售后详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAfterSales"
  /api/admin/orders:
    get:
      tags: [mall-admin]
      summary: 管理端订单列表
      security:
        - bearerAuth: []
      parameters:
        - name: buyerId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrderList"
  /api/admin/orders/{id}:
    get:
      tags: [mall-admin]
      summary: 管理端订单详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrder"
  /api/admin/orders/{id}/ship:
    post:
      tags: [mall-admin]
      summary: 管理端订单发货
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderShipRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrder"
  /api/admin/orders/{id}/close:
    post:
      tags: [mall-admin]
      summary: 管理端订单关闭
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrder"
  /api/admin/payments/{id}:
    get:
      tags: [mall-admin]
      summary: 管理端支付详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePayment"
  /api/admin/after-sales/{id}/review:
    post:
      tags: [mall-admin]
      summary: 管理端审核售后
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AfterSalesReviewRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAfterSales"
  /api/admin/after-sales/{id}/refund:
    post:
      tags: [mall-admin]
      summary: 管理端确认退款
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AfterSalesRefundRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAfterSales"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  schemas:
    ApiResponseAuthToken:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        data:
          $ref: "#/components/schemas/AuthToken"
    ApiResponseProduct:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        data:
          $ref: "#/components/schemas/ProductResponse"
    ApiResponseProductList:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductResponse"
    ApiResponseStock:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        data:
          $ref: "#/components/schemas/StockResponse"
    ApiResponseStockList:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/StockResponse"
    ApiResponseOrder:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        data:
          $ref: "#/components/schemas/OrderResponse"
    ApiResponseOrderList:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrderResponse"
    ApiResponsePayment:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        data:
          $ref: "#/components/schemas/PaymentResponse"
    ApiResponseAfterSales:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        data:
          $ref: "#/components/schemas/AfterSalesResponse"
    ApiResponseString:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        data:
          type: string
    LoginRequest:
      type: object
      required: [username, password, tenantId]
      properties:
        username:
          type: string
        password:
          type: string
        tenantId:
          type: string
        withRefresh:
          type: boolean
          default: true
    AuthToken:
      type: object
      properties:
        token:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        refreshExpiresAt:
          type: string
          format: date-time
        userId:
          type: integer
          format: int64
        tenantId:
          type: string
    ProductCreateRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
    ProductUpdateRequest:
      type: object
      required: [name, price, status]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        status:
          type: string
          enum: [DRAFT, ONLINE, OFFLINE]
    ProductResponse:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StockSetRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0
    StockAdjustRequest:
      type: object
      required: [delta]
      properties:
        delta:
          type: integer
    StockResponse:
      type: object
      properties:
        productId:
          type: string
        quantity:
          type: integer
        updatedAt:
          type: string
          format: date-time
    OrderCreateRequest:
      type: object
      required: [buyerId, items]
      properties:
        buyerId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemRequest"
    OrderItemRequest:
      type: object
      required: [productId, productName, price, quantity]
      properties:
        productId:
          type: string
        productName:
          type: string
        price:
          type: number
          format: double
        quantity:
          type: integer
          minimum: 1
    OrderShipRequest:
      type: object
      required: [carrier, trackingNo]
      properties:
        carrier:
          type: string
        trackingNo:
          type: string
    PaymentCallbackRequest:
      type: object
      required: [callbackId, orderId, tradeNo, status, signature]
      properties:
        callbackId:
          type: string
        orderId:
          type: string
        tradeNo:
          type: string
        status:
          type: string
          enum: [PAID, FAILED]
        signature:
          type: string
        rawPayload:
          type: string
    AfterSalesApplyRequest:
      type: object
      required: [orderId, type, reason]
      properties:
        orderId:
          type: string
        type:
          type: string
          enum: [REFUND_ONLY, RETURN_REFUND]
        reason:
          type: string
    AfterSalesReviewRequest:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
        remark:
          type: string
    AfterSalesRefundRequest:
      type: object
      properties:
        remark:
          type: string
    OrderResponse:
      type: object
      properties:
        id:
          type: string
        buyerId:
          type: string
        status:
          type: string
          enum: [CREATED, PAID, SHIPPED, COMPLETED, CANCELLED, CLOSED]
        totalAmount:
          type: number
          format: double
        shippingCarrier:
          type: string
          nullable: true
        trackingNo:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        shippedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemResponse"
    PaymentResponse:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        amount:
          type: number
          format: double
        status:
          type: string
          enum: [CREATED, PAID, FAILED, REFUNDED]
        channel:
          type: string
          enum: [MOCK, ALIPAY, WECHAT]
        tradeNo:
          type: string
          nullable: true
        rawCallback:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AfterSalesResponse:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        paymentId:
          type: string
          nullable: true
        type:
          type: string
          enum: [REFUND_ONLY, RETURN_REFUND]
        reason:
          type: string
        status:
          type: string
          enum: [APPLIED, APPROVED, REJECTED, REFUNDED, CANCELLED]
        remark:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderItemResponse:
      type: object
      properties:
        productId:
          type: string
        productName:
          type: string
        price:
          type: number
          format: double
        quantity:
          type: integer
        amount:
          type: number
          format: double
x-idempotency-guidelines:
  title: X-Idempotency-Key 规范
  description: |
    目的：保证创建订单/支付/取消等写操作在网络重试或重复点击时只生效一次。

    生成规则：
    1) 在“同一次业务意图”内保持稳定（重试必须使用同一个 key）。
    2) 新的一次业务操作必须生成新的 key。
    3) 推荐使用 UUID v4 或“业务语义+随机数/时间戳”组合。

    推荐格式：
    - UUID: 9f4f8c59-8e7a-4f6a-9a9d-1c8b7f1e6b3c
    - 语义化: ORDER_CREATE:{buyerId}:{yyyyMMdd}:{rand}

    场景示例：
    - 创建订单: X-Idempotency-Key: 4d2e3b9f-3e1e-4d4a-9f18-71dcaf4a4f05
    - 订单支付: X-Idempotency-Key: PAY:842444e0-0bad-49e8-88ec-89a03c357c49:ef7c2f3a
    - 取消订单: X-Idempotency-Key: CANCEL:842444e0-0bad-49e8-88ec-89a03c357c49:95b2c1d9
    - 管理端关单: X-Idempotency-Key: CLOSE:842444e0-0bad-49e8-88ec-89a03c357c49:ad13e7b1
    - 退款申请: X-Idempotency-Key: REFUND:842444e0-0bad-49e8-88ec-89a03c357c49:1b9ef3
