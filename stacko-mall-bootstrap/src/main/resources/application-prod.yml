spring:
  datasource:
    url: ${STACKO_MALL_DB_URL}
    username: ${STACKO_MALL_DB_USERNAME}
    password: ${STACKO_MALL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.springframework: warn
    org.mybatis.spring.mapper: error
  config: classpath:logback-plus.xml

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
