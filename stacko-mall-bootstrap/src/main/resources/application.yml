server:
  port: 8081
spring:
  profiles:
    active: jd

user:
  platform:
    web:
      swagger-bypass: false

sa-token:
  token-name: satoken
  token-prefix: Bearer
  timeout: 7200
  is-read-cookie: false
  is-read-body: false
  is-read-header: true



order:
  timeout:
    job-enabled: true
    minutes: 30
    batch-size: 200
    fixed-delay-ms: 60000

payment:
  mock:
    callback-secret: stacko-mall-callback-secret

mall:
  user-center:
    enabled: true
    base-url: http://localhost:8080
    acl-check-path: /api/acl/check
    current-user-path: /api/auth/current

