server:
  port: ${STACKO_MALL_PORT:8081}
spring:
  application:
    name: stacko-mall
  profiles:
    active: ${STACKO_MALL_PROFILE:jd}
  cloud:
    nacos:
      discovery:
        enabled: ${STACKO_NACOS_ENABLED:true}
        server-addr: ${STACKO_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${STACKO_NACOS_NAMESPACE:}
        group: ${STACKO_NACOS_GROUP:DEFAULT_GROUP}
        username: ${STACKO_NACOS_USERNAME:}
        password: ${STACKO_NACOS_PASSWORD:}
        health-indicator:
          enabled: ${STACKO_NACOS_HEALTH_INDICATOR_ENABLED:true}

user:
  platform:
    web:
      swagger-bypass: false

stacko:
  mall:
    gateway-identity:
      signing-secret: ${STACKO_GATEWAY_IDENTITY_SECRET:}
      max-age: ${STACKO_MALL_GATEWAY_IDENTITY_MAX_AGE:30s}
      allowed-clock-skew: ${STACKO_MALL_GATEWAY_IDENTITY_CLOCK_SKEW:5s}
      gateway-path-prefix: /mall
      expected-application-code: stacko-mall
      admin-portal-code: stacko-mall-admin
      admin-audience: stacko-mall-admin
      customer-portal-code: stacko-mall-web
      customer-audience: stacko-mall-web
      protected-paths:
        - /api/admin/**
        - /api/c/orders/**
        - /api/c/after-sales/**

order:
  timeout:
    job-enabled: true
    minutes: 30
    batch-size: 200
    fixed-delay-ms: 60000

payment:
  mock:
    callback-secret: ${STACKO_MALL_PAYMENT_CALLBACK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
