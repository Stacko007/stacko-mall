spring:
  profiles:
    active: jd

user:
  platform:
    web:
      swagger-bypass: false

sa-token:
  token-name: satoken
  token-prefix: Bearer
  timeout: 7200
  is-read-cookie: false
  is-read-body: false
  is-read-header: true

order:
  timeout:
    job-enabled: true
    minutes: 30
    batch-size: 200
    fixed-delay-ms: 60000
