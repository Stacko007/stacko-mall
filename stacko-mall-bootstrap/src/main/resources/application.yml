spring:
  profiles:
    active: jd

user:
  platform:
    web:
      swagger-bypass: false

sa-token:
  token-name: satoken
  token-prefix: Bearer
  timeout: 7200
  is-read-cookie: false
  is-read-body: false
  is-read-header: true

stacko:
  user:
    token:
      jwt:
        exclude-paths:
          - /api/c/products
          - /api/c/products/**
          - /api/c/payments/callback
          - /api/c/stocks/**

order:
  timeout:
    job-enabled: true
    minutes: 30
    batch-size: 200
    fixed-delay-ms: 60000

payment:
  mock:
    callback-secret: stacko-mall-callback-secret
