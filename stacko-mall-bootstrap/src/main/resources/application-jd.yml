spring:
  datasource:
    url: ${STACKO_MALL_DB_URL:jdbc:p6spy:mysql://127.0.0.1:3306/stacko_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${STACKO_MALL_DB_USERNAME:stacko_mall}
    password: ${STACKO_MALL_DB_PASSWORD:}
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.springframework: warn
    org.mybatis.spring.mapper: error
    p6spy: ${SQL_LOG_LEVEL:warn}
  config: classpath:logback-plus.xml

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    #log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
